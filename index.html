<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Art of Cinema</title>
    <!-- Fonts Google (SAMA PERSIS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        /* ---------- RESET & BASE (SAMA PERSIS) ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #eaeaea;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            line-height: 1.7;
            scroll-behavior: smooth;
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #b8860b;
            border-radius: 10px;
        }

        /* ---------- TIPOGRAFI ---------- */
        .serif {
            font-family: 'Playfair Display', serif;
        }

        .gold {
            color: #d4af37;
        }

        .spaced {
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 400;
        }

        /* ---------- SECTION UMUM ---------- */
        section {
            padding: 80px 40px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .section-sub {
            font-size: 1.1rem;
            color: #aaa;
            max-width: 600px;
            margin-bottom: 40px;
            border-left: 3px solid #d4af37;
            padding-left: 24px;
        }

        /* ---------- HERO ---------- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            border-bottom: 1px solid #222;
        }

        .hero .tagline {
            font-size: clamp(0.8rem, 2vw, 1rem);
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 900;
            line-height: 1.1;
            max-width: 900px;
        }

        .hero h1 .gold {
            font-style: italic;
        }

        .hero .sub-text {
            font-size: clamp(1rem, 2vw, 1.4rem);
            color: #bbb;
            max-width: 600px;
            margin-top: 30px;
            font-weight: 300;
        }

        .hero .divider {
            width: 80px;
            height: 2px;
            background: #d4af37;
            margin: 30px auto;
        }

        .scroll-hint {
            margin-top: 60px;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #555;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(10px);
            }
        }

        /* ---------- QUOTE SECTION ---------- */
        .quote-section {
            text-align: center;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        .quote-section blockquote {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 400;
            font-style: italic;
            max-width: 900px;
            margin: 0 auto 30px;
            line-height: 1.4;
        }

        .quote-section .attribution {
            font-size: 1rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #888;
        }

        /* ---------- GRID GAMBAR ---------- */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 40px;
        }

        .image-grid .grid-item {
            background: #1a1a1a;
            aspect-ratio: 2 / 3;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid #2a2a2a;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .image-grid .grid-item:hover {
            transform: scale(1.02);
            border-color: #d4af37;
        }

        .image-grid .grid-item .placeholder-text {
            text-align: center;
            padding: 10px;
        }

        .image-grid .grid-item .placeholder-text small {
            display: block;
            font-size: 0.6rem;
            color: #666;
            margin-top: 6px;
        }

        /* ---------- GENRE / FAVORITE ---------- */
        .genre-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .genre-list .genre-tag {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ccc;
            transition: all 0.3s ease;
        }

        .genre-list .genre-tag:hover {
            border-color: #d4af37;
            color: #d4af37;
            background: #111;
        }

        /* ---------- FOOTER ---------- */
        footer {
            text-align: center;
            padding: 60px 20px 40px;
            border-top: 1px solid #222;
            color: #555;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        footer .gold {
            letter-spacing: 4px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            section {
                padding: 60px 20px;
                min-height: auto;
            }
            .hero {
                min-height: 90vh;
            }
            .image-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .quote-section blockquote {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .image-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .genre-list .genre-tag {
                padding: 6px 16px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- =========================================================== -->
    <!-- ===== 1. UBAH SEMUA KONTEN DI BAWAH INI (DATA) ===== -->
    <!-- =========================================================== -->
    <script>
        const DATA = {
            // ----- HERO (Bagian Pembuka) -----
            tagline: "✦ The Art of Cinema ✦",
            heroGold1: "Light",        // Kata berwarna emas (baris 1)
            heroText1: "goes down,",   // Kata putih (baris 1)
            heroGold2: "magic",        // Kata berwarna emas (baris 2)
            heroText2: "begins.",      // Kata putih (baris 2)
            heroSub: 'A personal project for the love of cinema. <br /> Great movies stay with you—like old friends.',

            // ----- QUOTE (Kutipan) -----
            quote: '“A truly great movie can change the way you see everything. An artist can take you on a journey as you discover the world together.”',
            quoteAttr: '— Return to certain scenes',

            // ----- SCENES (Bagian Grid Gambar) -----
            scenesTitle: 'Scenes I <span class="gold">Return</span> To',
            scenesSub: 'Years pass, life changes, yet these moments remain untouched by time. We return to them not for the story, but for the feeling they hold.',
            scenesList: [
                { icon: '🎬', label: 'Scene 1', desc: 'memory' },
                { icon: '🎞️', label: 'Scene 2', desc: 'emotion' },
                { icon: '🌙', label: 'Scene 3', desc: 'silence' },
                { icon: '🕯️', label: 'Scene 4', desc: 'forever' },
                { icon: '🎭', label: 'Scene 5', desc: 'transformation' },
                { icon: '🌌', label: 'Scene 6', desc: 'cosmic' }
            ],

            // ----- VOICES (Bagian Sutradara/Aktor) -----
            voicesTitle: 'Voices of <span class="gold">Cinema</span>',
            voicesSub: 'Cinema is carried by people. Those who shape the image, and those who inhabit it. Through restraint, intention, and presence, they create moments that feel lived-in.',
            directors: ['David Fincher', 'Christopher Nolan', 'Denis Villeneuve'],
            actors: ['Christian Bale', 'Leonardo DiCaprio', 'Margot Robbie'],
            longform: ['The Sopranos', 'Breaking Bad', 'Game of Thrones'],

            // ----- GENRES (Bagian Genre) -----
            genresTitle: 'Genres That <span class="gold">Linger</span>',
            genresSub: 'Genre is cinema’s recurring language. Each carries its own grammar— from quiet intimacy to cosmic scale.',
            genresList: ['Romantic Comedy', 'Science Fiction', 'Fantasy', 'Crime', 'Drama', 'Thriller', 'Horror', 'Western'],

            // ----- FOOTER (Bagian Bawah) -----
            footerQuote: '“I just love watching movies — you escape, you don’t have to be in your life, you can be in their life.”',
            footerQuoteSub: '— guess i will see you at the cinema',
            footerBottom: '✦ T H E   A R T   O F   C I N E M A ✦',
            footerYear: '2026'
        };
    </script>
    <!-- =========================================================== -->
    <!-- ===== AKHIR BAGIAN KONTEN (JANGAN DIUBAH) ===== -->
    <!-- =========================================================== -->


    <!-- ========== STRUKTUR HTML (JANGAN DIUBAH) ========== -->
    <section class="hero">
        <div class="tagline" id="hero-tagline"></div>
        <h1>
            <span class="gold" id="hero-gold1"></span> <span id="hero-text1"></span><br />
            <span class="gold" id="hero-gold2"></span> <span id="hero-text2"></span>
        </h1>
        <div class="divider"></div>
        <p class="sub-text" id="hero-sub"></p>
        <div class="scroll-hint">— Scroll to explore —</div>
    </section>

    <section class="quote-section">
        <blockquote id="quote-text"></blockquote>
        <div class="attribution" id="quote-attr"></div>
    </section>

    <section>
        <h2 class="section-title" id="scenes-title"></h2>
        <p class="section-sub" id="scenes-sub"></p>
        <div class="image-grid" id="scenes-grid"></div>
    </section>

    <section>
        <h2 class="section-title" id="voices-title"></h2>
        <p class="section-sub" id="voices-sub"></p>
        <div style="display: flex; flex-wrap: wrap; gap: 40px; margin-top: 20px;">
            <div style="flex: 1; min-width: 200px;">
                <h3 style="font-weight: 400; letter-spacing: 2px; margin-bottom: 8px; color: #d4af37;">Directors</h3>
                <ul style="list-style: none; color: #bbb; font-size: 0.95rem;" id="directors-list"></ul>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <h3 style="font-weight: 400; letter-spacing: 2px; margin-bottom: 8px; color: #d4af37;">Actors</h3>
                <ul style="list-style: none; color: #bbb; font-size: 0.95rem;" id="actors-list"></ul>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <h3 style="font-weight: 400; letter-spacing: 2px; margin-bottom: 8px; color: #d4af37;">Longform</h3>
                <ul style="list-style: none; color: #bbb; font-size: 0.95rem;" id="longform-list"></ul>
            </div>
        </div>
    </section>

    <section>
        <h2 class="section-title" id="genres-title"></h2>
        <p class="section-sub" id="genres-sub"></p>
        <div class="genre-list" id="genres-container"></div>
        <div style="margin-top: 50px; border-top: 1px solid #222; padding-top: 40px;">
            <p style="font-size: 0.9rem; color: #777; letter-spacing: 2px; text-transform: uppercase;" id="footer-quote"></p>
            <p style="margin-top: 12px; color: #555; font-size: 0.8rem; letter-spacing: 4px;" id="footer-quote-sub"></p>
        </div>
    </section>

    <footer>
        <span class="gold" id="footer-bottom"></span>
        <br /><br />
        &copy; <span id="footer-year"></span> — for the love of film
    </footer>

    <!-- ========== SCRIPT RENDER (JANGAN DIUBAH) ========== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // 1. HERO
            document.getElementById('hero-tagline').textContent = DATA.tagline;
            document.getElementById('hero-gold1').textContent = DATA.heroGold1;
            document.getElementById('hero-text1').textContent = DATA.heroText1;
            document.getElementById('hero-gold2').textContent = DATA.heroGold2;
            document.getElementById('hero-text2').textContent = DATA.heroText2;
            document.getElementById('hero-sub').innerHTML = DATA.heroSub;

            // 2. QUOTE
            document.getElementById('quote-text').textContent = DATA.quote;
            document.getElementById('quote-attr').textContent = DATA.quoteAttr;

            // 3. SCENES (Grid)
            document.getElementById('scenes-title').innerHTML = DATA.scenesTitle;
            document.getElementById('scenes-sub').textContent = DATA.scenesSub;
            const grid = document.getElementById('scenes-grid');
            grid.innerHTML = DATA.scenesList.map(item =>
                `<div class="grid-item">
                    <div class="placeholder-text">
                        ${item.icon}<br />${item.label}
                        <small>— ${item.desc} —</small>
                    </div>
                </div>`
            ).join('');

            // 4. VOICES (Lists)
            document.getElementById('voices-title').innerHTML = DATA.voicesTitle;
            document.getElementById('voices-sub').textContent = DATA.voicesSub;

            const dirList = document.getElementById('directors-list');
            DATA.directors.forEach(d => { let li = document.createElement('li');
                li.textContent = '— ' + d;
                li.style.padding = '4px 0';
                dirList.appendChild(li) });

            const actList = document.getElementById('actors-list');
            DATA.actors.forEach(d => { let li = document.createElement('li');
                li.textContent = '— ' + d;
                li.style.padding = '4px 0';
                actList.appendChild(li) });

            const longList = document.getElementById('longform-list');
            DATA.longform.forEach(d => { let li = document.createElement('li');
                li.textContent = '— ' + d;
                li.style.padding = '4px 0';
                longList.appendChild(li) });

            // 5. GENRES
            document.getElementById('genres-title').innerHTML = DATA.genresTitle;
            document.getElementById('genres-sub').textContent = DATA.genresSub;
            const genreContainer = document.getElementById('genres-container');
            DATA.genresList.forEach(g => {
                let span = document.createElement('span');
                span.className = 'genre-tag';
                span.textContent = g;
                genreContainer.appendChild(span);
            });

            // 6. FOOTER
            document.getElementById('footer-quote').textContent = DATA.footerQuote;
            document.getElementById('footer-quote-sub').textContent = DATA.footerQuoteSub;
            document.getElementById('footer-bottom').textContent = DATA.footerBottom;
            document.getElementById('footer-year').textContent = DATA.footerYear;

        });
    </script>

</body>
</html>
